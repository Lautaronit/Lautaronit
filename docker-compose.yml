# =============================================================================
# On It — entorno local tipo producción con PostgreSQL + backend en Docker.
# -----------------------------------------------------------------------------
# Útil para probar la app como corre en producción (con Postgres, no SQLite).
#
# IMPORTANTE: para usar Postgres hay que cambiar en apps/backend/prisma/schema.prisma
#   provider = "postgresql"
# Levantar con:  docker compose up --build
# =============================================================================

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: onit
      POSTGRES_PASSWORD: onit
      POSTGRES_DB: onit
    ports:
      - "5432:5432"
    volumes:
      - onit_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onit"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      DATABASE_URL: "postgresql://onit:onit@db:5432/onit"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
    ports:
      - "3000:3000"

volumes:
  onit_pgdata:
