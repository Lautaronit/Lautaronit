# =============================================================================
# On It — Integración continua (CI)
# -----------------------------------------------------------------------------
# En cada push y pull request: instala, genera Prisma, chequea tipos, corre los
# tests y compila. Si algo falla, el PR queda marcado en rojo antes de mergear.
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      - name: Generar cliente de Prisma
        run: npm run prisma:generate --workspace @on-it/backend

      - name: Chequeo de tipos
        run: npm run typecheck --workspaces --if-present

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
